server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file is handed to index.html
    # so client-side routes (/alerts, /cases/case_x, ...) survive a hard
    # refresh or a pasted deep link instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy. The bundle is built with VITE_API_BASE_URL=/v1
    # (see Dockerfile), so the browser never needs to know the backend's
    # hostname and there is no cross-origin preflight in the container stack.
    # `backend` resolves via the docker-compose network.
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Hashed asset filenames (Vite) are immutable; index.html must not be
    # cached or clients pin themselves to a stale bundle after a deploy.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
