name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run tests
        env:
          SENTINELIQ_DATABASE_URL: "sqlite://"
          SENTINELIQ_JWT_SECRET: "ci-test-secret"
          # Keep generated artifacts inside the workspace so a failed run can
          # upload them and nothing lands in the runner's home directory.
          SENTINELIQ_REPORT_DIR: "./var/reports"
          SENTINELIQ_ML_MODEL_DIR: "./var/models"
        run: pytest -v

  migrations:
    name: Alembic migrations apply cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Runs against real Postgres, not SQLite: `alembic upgrade head` passing on
    # SQLite says little about whether it works on the production engine, and
    # batch-mode DDL differences are exactly where migrations break.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentineliq
          POSTGRES_PASSWORD: sentineliq
          POSTGRES_DB: sentineliq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade to head
        env:
          SENTINELIQ_DATABASE_URL: postgresql+psycopg2://sentineliq:sentineliq@localhost:5432/sentineliq
        run: alembic upgrade head

      - name: Re-running is a no-op (idempotent, as the entrypoint assumes)
        env:
          SENTINELIQ_DATABASE_URL: postgresql+psycopg2://sentineliq:sentineliq@localhost:5432/sentineliq
        run: alembic upgrade head

      - name: Models match the migration history
        env:
          SENTINELIQ_DATABASE_URL: postgresql+psycopg2://sentineliq:sentineliq@localhost:5432/sentineliq
        # Fails when a model change has no corresponding migration -- the drift
        # that otherwise surfaces as a production 500 on a missing column.
        run: alembic check

  frontend-lint-build-test:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check + build
        run: npm run build

  container-build:
    name: Container build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sentineliq-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t sentineliq-frontend:ci ./frontend

  stack-smoke-test:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [container-build]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for the backend to report ready
        # Readiness, not liveness: this proves migrations ran and Postgres is
        # reachable, which is what the earlier compose file silently got wrong.
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/readiness | grep -q '"status": *"ok"'; then
              echo "backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "backend never became ready"
          docker compose logs --no-color
          exit 1

      - name: Frontend serves the app and proxies the API
        # Guards the bug this stack had: the built bundle could not reach the
        # backend, because VITE_API_BASE_URL was passed as a runtime env to nginx
        # instead of as a build arg. A 200 on /v1/billing/plans through port 5173
        # proves the proxy path works end to end.
        run: |
          curl -fsS http://localhost:5173/ | grep -qi "<div id=\"root\"" || (echo "index.html not served"; exit 1)
          curl -fsS http://localhost:5173/v1/billing/plans | grep -q '"slug"' || (echo "API proxy broken"; exit 1)

      - name: Deep links survive a hard refresh (SPA fallback)
        run: |
          curl -fsS http://localhost:5173/cases/case_example | grep -qi "<div id=\"root\"" \
            || (echo "SPA history fallback missing"; exit 1)

      - name: End-to-end ingest -> detect -> alert
        # The whole point of the product, exercised through the real stack:
        # sign up, author a rule, issue a service token, ingest an event, and
        # assert an alert came back.
        run: |
          set -euo pipefail
          API=http://localhost:8000/v1
          # NOTE: deliberately not an @example.test address. email-validator
          # rejects special-use TLDs (.test/.invalid/.example, and example.com)
          # outside the test suite, which opts in via
          # email_validator.TEST_ENVIRONMENT. A .test address here returns 422
          # and the smoke test would fail for the wrong reason.
          TOKEN=$(curl -fsS -X POST "$API/auth/signup" -H 'Content-Type: application/json' \
            -d '{"companyName":"CI Co","email":"ci-smoke@sentineliq-ci.io","password":"ci-correct-horse-1"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          curl -fsS -X POST "$API/detection-rules" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci failed logins","severity":"critical","condition":{"field":"event_action","op":"eq","value":"login_failed"}}' > /dev/null
          SVC=$(curl -fsS -X POST "$API/tenants/me/service-tokens" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"name":"ci-collector"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST "$API/events/ingest" -H "X-Service-Token: $SVC" \
            -H 'Content-Type: application/json' \
            -d '{"events":[{"source":"ci","payload":{"eventAction":"login_failed","severity":"critical","actor":"ci-user","sourceIp":"203.0.113.10"}}]}' > /dev/null
          # Queued mode: the worker processes asynchronously, so poll.
          for attempt in $(seq 1 30); do
            TOTAL=$(curl -fsS "$API/alerts" -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
            if [ "$TOTAL" -ge 1 ]; then
              echo "detection produced $TOTAL alert(s)"
              exit 0
            fi
            sleep 2
          done
          echo "no alert was produced by the ingest -> detect path"
          docker compose logs --no-color backend worker
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
