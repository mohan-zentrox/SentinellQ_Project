[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these from a template we do not control; import order and
# unused-import noise in generated revisions is not worth a manual edit pass
# on every `alembic revision --autogenerate`.
"app/alembic/versions/*.py" = ["I001", "F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
