# Local development stack.
#
# Services actually run here: PostgreSQL (metadata DB + the Postgres-backed
# telemetry store adapter), Redis (queue backend for the API -> worker hop),
# the FastAPI backend, the ingestion worker, and the nginx-served React
# frontend.
#
# ClickHouse/OpenSearch (documented target telemetry store), Kafka/Redpanda
# (documented target streaming platform), and Stripe (documented target
# billing provider) are NOT run here -- they are documented future swap-ins
# behind the TelemetryStore, QueueBackend, and BillingProvider interfaces in
# backend/app/services/, each selected by a SENTINELIQ_* setting that the
# factory functions actually read.
#
# Schema is applied by backend/docker-entrypoint.sh (`alembic upgrade head`)
# on container start; nothing here relies on Base.metadata.create_all().

x-backend-env: &backend-env
  SENTINELIQ_DATABASE_URL: postgresql+psycopg2://sentineliq:sentineliq@postgres:5432/sentineliq
  SENTINELIQ_AUTO_CREATE_SCHEMA: "false"
  SENTINELIQ_TELEMETRY_STORE_BACKEND: postgres
  SENTINELIQ_QUEUE_BACKEND: redis
  SENTINELIQ_REDIS_URL: redis://redis:6379/0
  SENTINELIQ_JWT_SECRET: dev-only-secret-change-me
  SENTINELIQ_BILLING_PROVIDER: mock_stripe
  SENTINELIQ_CORS_ORIGINS: '["http://localhost:5173"]'
  SENTINELIQ_LOG_FORMAT: json

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: sentineliq
      POSTGRES_DB: sentineliq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineliq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Consumes the raw-events topic the API publishes to, normalizes, persists,
  # and runs detection. Shares the backend image; only the command differs.
  worker:
    build:
      context: ./backend
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin path; nginx.conf proxies /v1/ -> backend:8000. Override
        # with an absolute URL when the API lives on another host.
        VITE_API_BASE_URL: /v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
